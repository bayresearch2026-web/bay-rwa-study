<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<title>BAY 리서치팀 · RWA 스터디</title>
<meta name="description" content="Blockchain at Yonsei 리서치팀 RWA 스터디 — 총 9회차 진행안과 스터디 기록">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="nav"></div>

<div class="hero-wrap">
  <div class="hero">
    <div class="hero-l">
      <span class="eyebrow" id="h-eyebrow"></span>
      <h1><span class="ac" id="h-ac"></span> <span id="h-rest"></span></h1>
      <p class="hero-sub" id="h-sub"></p>
      <div id="h-cta"></div>
      <div class="stats" id="h-stats"></div>
    </div>
    <div class="hero-r">
      <img src="assets/hero.png" alt="">
    </div>
  </div>
</div>

<div class="wrap" id="main"></div>

<footer id="foot"></footer>

<script src="data/sessions.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var S = window.STUDY, D = S.defaults, M = S.meta;

  document.getElementById('nav').innerHTML = UI.nav({ pill: '전체 회차' });

  /* ---- 히어로 ---- */
  document.getElementById('h-eyebrow').textContent = M.eyebrow;
  document.getElementById('h-ac').textContent   = M.heroAccent;
  document.getElementById('h-rest').textContent = M.heroRest;
  document.getElementById('h-sub').textContent  = M.heroSub;

  if (M.notionUrl) {
    document.getElementById('h-cta').innerHTML =
      '<a class="cta" href="' + M.notionUrl + '" target="_blank" rel="noopener">' +
        '공용 노션 페이지<span class="go">&#8599;</span></a>';
  }

  var ready = S.sessions.filter(function (s) { return s.status !== 'tbd'; }).length;
  document.getElementById('h-stats').innerHTML =
    '<div class="stat"><b>' + S.sessions.length + '</b><span>회차</span></div>' +
    '<div class="stat"><b>' + D.memberCount + '</b><span>명</span></div>' +
    '<div class="stat"><b>' + D.totalMinutes + '</b><span>분 · 회차당</span></div>' +
    '<div class="stat"><b>' + ready + '</b><span>회차 진행안 확정</span></div>';

  /* ---- 본문 ---- */
  document.getElementById('main').innerHTML =
    UI.section('01', '회차', '카드를 누르면 회차별 진행안으로 이동합니다',
      UI.sessionGrid() +
      '<div class="note">지금은 <b>진행안</b>만 공유합니다. 회차가 끝나는 대로 각 회차 페이지의 ' +
      '<b>진행 기록</b>에 발표 정리본·질문 답변·참고 자료가 쌓입니다.</div>'
    ) +

    UI.section('02', '사전 준비', '모든 회차 공통 · 세션 전날까지',
      UI.prepTable()
    ) +

    UI.section('03', '진행 방식', D.flowNote,
      '<div class="card">' + UI.stepsBar() +
      '<div class="empty" style="text-align:left;padding:18px">' +
        '담당자 ' + D.memberCount + '명이 각 ' + D.minutesPerSlot + '분씩, 총 ' + D.totalMinutes + '분. ' +
        '회차별 시간표는 각 회차 페이지에서 확인하세요.' +
      '</div></div>'
    );

  /* ---- 푸터 ---- */
  document.getElementById('foot').innerHTML =
    M.team + ' · ' + M.org + '<br>' +
    S.sessions.length + '회차 · 회차당 ' + D.memberCount + '인 · ' + D.totalMinutes + '분';

  document.title = M.siteTitle;
})();
</script>

</body>
</html>
